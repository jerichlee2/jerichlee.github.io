    <script>
      (function () {
        var modifiedTime = document.getElementById("last-modified");
        var copyrightYear = document.getElementById("copyright-year");
        var liveHosts = ["jerichlee.com", "www.jerichlee.com"];

        function setModifiedDate(date) {
          if (!modifiedTime || Number.isNaN(date.getTime())) {
            return;
          }

          modifiedTime.dateTime = date.toISOString().slice(0, 10);
          modifiedTime.textContent = new Intl.DateTimeFormat("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
          }).format(date);
        }

        if (copyrightYear) {
          copyrightYear.textContent = new Date().getFullYear();
        }

        setModifiedDate(new Date(document.lastModified));

        if (liveHosts.indexOf(window.location.hostname) !== -1) {
          fetch("https://api.github.com/repos/jerichlee2/jerichlee.github.io/commits/main")
            .then(function (response) {
              if (!response.ok) {
                throw new Error("Could not fetch latest commit.");
              }

              return response.json();
            })
            .then(function (data) {
              if (
                data &&
                data.commit &&
                data.commit.committer &&
                data.commit.committer.date
              ) {
                setModifiedDate(new Date(data.commit.committer.date));
              }
            })
            .catch(function () {
              setModifiedDate(new Date(document.lastModified));
            });
        }
      })();
    </script>
