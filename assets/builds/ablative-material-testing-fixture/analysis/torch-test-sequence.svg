<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="sequence-title sequence-desc">
  <title id="sequence-title">Torch-test sequence</title>
  <desc id="sequence-desc">Graphite exposure for a nominal 3 seconds, followed by a 180-degree specimen transfer, then ChamberSafe ablative exposure for a nominal 20 seconds in the baseline run or 10 seconds in the hot run. Transfer duration is unspecified. This stage-order diagram is separate from the recorded time axis; stage widths do not encode elapsed time.</desc>
  <defs>
    <marker id="sequence-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#68635a"/>
    </marker>
  </defs>
  <rect width="1120" height="250" fill="#fffdfa"/>
  <g font-family="Georgia,serif" fill="#28251f">
    <text x="54" y="37" font-size="26" font-weight="bold">Torch-test sequence</text>
    <text x="1066" y="37" text-anchor="end" font-size="18" fill="#68635a">Nominal exposure durations</text>
    <rect x="54" y="67" width="272" height="68" fill="#ece7dd"/>
    <rect x="392" y="67" width="272" height="68" fill="#f3f0ea"/>
    <rect x="730" y="67" width="336" height="68" fill="#ece7dd"/>
    <g font-size="25" text-anchor="middle">
      <text x="190" y="109">Graphite</text>
      <text x="528" y="109">Transition</text>
      <text x="898" y="109">Ablative</text>
    </g>
    <g stroke="#68635a" stroke-width="1.5" fill="none" marker-end="url(#sequence-arrow)">
      <path d="M342 101H375"/>
      <path d="M680 101H713"/>
    </g>
    <g stroke="#68635a" stroke-width="1.5" fill="none">
      <path d="M54 145V158H326V145M190 158V166"/>
      <path d="M392 145V158H664V145M528 158V166"/>
      <path d="M730 145V158H1066V145M898 158V166"/>
    </g>
    <g text-anchor="middle" font-size="22">
      <text x="190" y="194">3 s</text>
      <text x="528" y="194">180° transfer</text>
      <text x="898" y="194">20 s baseline / 10 s hot</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#68635a">
      <text x="190" y="225">Torch on</text>
      <text x="898" y="225">Torch on · ChamberSafe</text>
    </g>
  </g>
</svg>
