<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Mixed-evidence dimple depths versus graphite-equivalent dose</title><desc id="desc">Blue baseline assumes 3 millimeters. Orange hot is the user-reported approximate one-eighth-inch depth, converted to 3.175 millimeters and held fixed. The blue rectangle and orange horizontal line show selected input sensitivity, not confidence intervals. Hot depth measurement uncertainty is unknown and excluded. No depth versus dose law is fitted here.</desc><rect width="100%" height="100%" fill="#fffdfa"/><g font-family="Georgia,serif" fill="#28251f"><text x="50" y="42" font-size="28" font-weight="bold">One assumed depth; one user-reported depth</text><text x="50" y="76" font-size="21">Baseline: assumed 3 mm · Hot: reported ≈1/8 in (≈3.2 mm)</text><text x="50" y="109" font-size="18" fill="#686158">Selected sensitivities only; hot depth measurement uncertainty is excluded.</text><path d="M100 144V500" stroke="#e0dacf"/><text x="100" y="529" font-size="18" text-anchor="middle">0</text><path d="M269 144V500" stroke="#e0dacf"/><text x="269" y="529" font-size="18" text-anchor="middle">2</text><path d="M438 144V500" stroke="#e0dacf"/><text x="438" y="529" font-size="18" text-anchor="middle">4</text><path d="M607 144V500" stroke="#e0dacf"/><text x="607" y="529" font-size="18" text-anchor="middle">6</text><path d="M776 144V500" stroke="#e0dacf"/><text x="776" y="529" font-size="18" text-anchor="middle">8</text><path d="M945 144V500" stroke="#e0dacf"/><text x="945" y="529" font-size="18" text-anchor="middle">10</text><path d="M100 500H945" stroke="#e0dacf"/><text x="84" y="506" font-size="18" text-anchor="end">0</text><path d="M100 440.6666666666667H945" stroke="#e0dacf"/><text x="84" y="446.6666666666667" font-size="18" text-anchor="end">1</text><path d="M100 381.33333333333337H945" stroke="#e0dacf"/><text x="84" y="387.33333333333337" font-size="18" text-anchor="end">2</text><path d="M100 322H945" stroke="#e0dacf"/><text x="84" y="328" font-size="18" text-anchor="end">3</text><path d="M100 262.6666666666667H945" stroke="#e0dacf"/><text x="84" y="268.6666666666667" font-size="18" text-anchor="end">4</text><path d="M100 203.33333333333331H945" stroke="#e0dacf"/><text x="84" y="209.33333333333331" font-size="18" text-anchor="end">5</text><path d="M100 144H945" stroke="#e0dacf"/><text x="84" y="150" font-size="18" text-anchor="end">6</text><rect x="403.786288" y="203.33333333333331" width="307.94774399999994" height="237.33333333333337" fill="#2074a3" fill-opacity="0.09" stroke="#2074a3" stroke-dasharray="7 5" stroke-width="2"/><circle cx="538.048" cy="322" r="7" fill="#fffdfa" stroke="#2074a3" stroke-width="3"/><text x="551.048" y="352" font-size="19" fill="#2074a3">20 s baseline · assumed 3 mm</text><path d="M424.438426 311.6166666666667H822.4557340000001" fill="none" stroke="#b95a1a" stroke-dasharray="7 5" stroke-width="2"/><circle cx="593.818" cy="311.6166666666667" r="7" fill="#b95a1a" stroke="#b95a1a" stroke-width="3"/><text x="606.818" y="294.6166666666667" font-size="19" fill="#b95a1a">10 s hot · reported ≈3.2 mm</text><path d="M100 144V500H945" fill="none" stroke="#686158"/><text x="520" y="569" font-size="22" text-anchor="middle">Graphite-equivalent dose (MJ/m²) · not absorbed brick energy</text><text transform="translate(35 325) rotate(-90)" text-anchor="middle" font-size="22">Depression depth (mm)</text><text x="50" y="610" font-size="18" fill="#686158">Baseline remains assumed; this does not establish an experimental depth–dose law.</text></g></svg>